# /etc/nginx/sites-available/aajkagadha.tech   (certbot adds the 443 / certificate lines for you)
# The game runs in Docker and listens on 127.0.0.1:3000; nginx is the public front door with HTTPS.
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    server_name aajkagadha.tech www.aajkagadha.tech;

    client_max_body_size 21m;          # song uploads in private rooms (the app caps them at 20 MB)

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;            # WebSockets
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;        # lets the app know the visit was HTTPS
        proxy_read_timeout 75s;
    }
}
