<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Donkey of the Day Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=Mukta:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --page:#E3EBE8; --surface:#F6F9F7; --ink:#15221E; --muted:#4D615B; --line:#C3D2CD;
  --felt:#0F5563; --felt2:#0A4250; --feltInk:#EEF6F3; --feltMuted:#A6C8C2; --feltLine:rgba(255,255,255,.14);
  --marigold:#F2A516; --rani:#C81D63; --card:#FBF6EA; --cardInk:#1C1A17; --cardRed:#C1272D;
  --ok:#2E7D4F; --warn:#B4231F;
  --display:"Rozha One", "Iowan Old Style", Georgia, serif;
  --body:"Mukta", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
  box-sizing: border-box; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --page:#06181C; --surface:#0D262C; --ink:#E6F0ED; --muted:#98B1AB; --line:#1F3F46;
  --felt:#0B3F4A; --felt2:#072E36; --feltInk:#E9F3F0; --feltMuted:#93B7B1; --feltLine:rgba(255,255,255,.12);
  --card:#F3EDDF; --ok:#5DBB86; --warn:#F07A73; color-scheme: dark; } }
:root[data-theme="dark"]{ --page:#06181C; --surface:#0D262C; --ink:#E6F0ED; --muted:#98B1AB; --line:#1F3F46;
  --felt:#0B3F4A; --felt2:#072E36; --feltInk:#E9F3F0; --feltMuted:#93B7B1; --feltLine:rgba(255,255,255,.12);
  --card:#F3EDDF; --ok:#5DBB86; --warn:#F07A73; color-scheme: dark; }
html{ height:100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
*,*::before,*::after{ box-sizing:border-box; }
body{ margin:0; min-height:100%; background:var(--page); color:var(--ink); font:400 17px/1.45 var(--body); -webkit-tap-highlight-color:transparent; }
button,input,select{ font:inherit; color:inherit; }
button{ cursor:pointer; }
:focus-visible{ outline:3px solid var(--marigold); outline-offset:2px; }
.hidden{ display:none !important; }
.stripe{ height:6px; background:repeating-linear-gradient(-45deg,var(--rani) 0 10px,var(--marigold) 10px 20px,var(--felt) 20px 30px); }
.wrap{ max-width:720px; margin:0 auto; padding:16px; }
h1,h2,h3{ font-family:var(--display); font-weight:400; margin:0; line-height:1.1; }
.btn{ white-space:nowrap; border:0; border-radius:10px; padding:11px 18px; background:var(--felt); color:var(--feltInk); font-weight:700; min-height:44px; }
.btn.alt{ background:transparent; color:var(--ink); box-shadow:inset 0 0 0 1.5px var(--line); }
.btn.gold{ background:var(--marigold); color:#1E1606; }
.btn.small{ padding:6px 12px; min-height:36px; font-size:15px; }
.btn:disabled{ opacity:.45; cursor:not-allowed; }
.felt .btn.alt{ color:var(--feltInk); box-shadow:inset 0 0 0 1.5px var(--feltLine); }
label.f{ display:block; font-weight:500; margin:14px 0 6px; }
input.t{ width:100%; padding:11px 12px; border-radius:10px; border:1.5px solid var(--line); background:var(--surface); min-height:44px; }
.muted{ color:var(--muted); }
.note{ font-size:15px; color:var(--muted); }
.err{ color:var(--warn); font-weight:500; }
.row{ display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
.grow{ flex:1 1 auto; }

/* home */
#home .hero{ padding:36px 0 8px; }
#home h1{ font-size:clamp(46px, 12vw, 84px); letter-spacing:-.5px; }
#home .tag{ font-size:19px; color:var(--muted); margin:10px 0 0; max-width:30em; }
.choices{ display:grid; gap:12px; margin-top:22px; }
.choice{ background:var(--surface); border:1.5px solid var(--line); border-radius:14px; padding:16px; }
.choice h3{ font-size:24px; margin-bottom:4px; }
.joinrow{ display:flex; gap:8px; margin-top:10px; }
.joinrow input{ text-transform:uppercase; letter-spacing:3px; font-weight:700; }

/* lobby */
.code{ font-family:var(--display); font-size:44px; letter-spacing:6px; }
.list{ list-style:none; margin:8px 0 0; padding:0; border-top:1px solid var(--line); }
.list li{ display:flex; align-items:center; gap:10px; padding:10px 2px; border-bottom:1px solid var(--line); }
.dot{ width:9px; height:9px; border-radius:50%; background:var(--muted); flex:none; }
.dot.on{ background:var(--ok); }
.tagp{ white-space:nowrap; font-size:13px; padding:1px 8px; border-radius:20px; box-shadow:inset 0 0 0 1px var(--line); color:var(--muted); }
.tagp.go{ color:var(--ok); box-shadow:inset 0 0 0 1px var(--ok); }
section.blk{ margin-top:22px; }
section.blk > h2{ font-size:26px; }
.tracks{ display:grid; gap:8px; margin-top:8px; }
.track{ display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:12px; border:1.5px solid var(--line); background:var(--surface); text-align:left; width:100%; }
.track.sel{ border-color:var(--marigold); box-shadow:0 0 0 2px var(--marigold) inset; }
.track b{ font-weight:700; }
.seg{ display:inline-flex; border-radius:10px; box-shadow:inset 0 0 0 1.5px var(--line); overflow:hidden; }
.seg button{ border:0; background:transparent; padding:8px 14px; min-height:40px; }
.seg button[aria-pressed="true"]{ background:var(--felt); color:var(--feltInk); }
details.rules{ margin-top:10px; background:var(--surface); border:1.5px solid var(--line); border-radius:12px; padding:10px 14px; }
details.rules summary{ font-weight:700; cursor:pointer; }
.rules ol, .rules ul{ padding-left:20px; margin:8px 0; }
.rules li{ margin:4px 0; }

/* game */
#game{ min-height:100vh; display:flex; flex-direction:column; }
.felt{ flex:1 0 auto; display:flex; flex-direction:column; background:radial-gradient(120% 90% at 50% 30%, var(--felt) 0%, var(--felt2) 100%); color:var(--feltInk); }
.topbar{ display:flex; align-items:center; gap:8px; padding:8px 12px; }
.topbar .ttl{ font-family:var(--display); font-size:20px; white-space:nowrap; }
.topbar{ flex-wrap:nowrap; }
@media (max-width:420px){ .chip .lbl{ display:none; } .chip.mus .lbl{ display:inline; } .chip.mus{ max-width:30vw; } .lvtxt{ display:none; } .seat .nm{ font-size:13px; } .seat .av{ width:18px; height:18px; font-size:11px; } .chip{ padding:5px 9px; font-size:13px; } .topbar .ttl{ font-size:17px; } }
.chip{ white-space:nowrap; max-width:36vw; overflow:hidden; text-overflow:ellipsis; border:0; border-radius:20px; padding:5px 12px; background:rgba(255,255,255,.1); color:var(--feltInk); font-size:14px; min-height:34px; }
.seats{ display:grid; grid-template-columns:repeat(var(--cols,4), minmax(0,1fr)); gap:6px; padding:4px 10px 8px; }
.seat{ position:relative; border-radius:12px; padding:7px 8px; background:rgba(0,0,0,.18); min-width:0; border:2px solid transparent; }
.seat.turn{ border-color:var(--marigold); }
.seat.done{ opacity:.55; }
.seat .nm{ font-weight:700; font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; display:flex; gap:4px; align-items:center; }
.seat .ct{ font-size:13px; color:var(--feltMuted); display:flex; gap:4px; align-items:center; flex-wrap:wrap; }
.pips{ display:flex; gap:3px; margin-top:3px; }
.pip{ width:11px; height:11px; border-radius:3px; box-shadow:inset 0 0 0 1.5px var(--feltMuted); }
.pip.on{ background:var(--rani); box-shadow:none; }
.badge{ font-size:11px; font-weight:700; border-radius:6px; padding:0 5px; background:var(--marigold); color:#1E1606; flex:none; }
.badge.x{ background:transparent; color:var(--feltMuted); box-shadow:inset 0 0 0 1px var(--feltMuted); }
.react{ position:absolute; right:6px; top:-10px; font-size:24px; animation:pop 2.4s ease forwards; pointer-events:none; }
@keyframes pop{ 0%{transform:scale(.4);opacity:0} 12%{transform:scale(1.15);opacity:1} 80%{opacity:1} 100%{opacity:0; transform:translateY(-10px)} }
.dir{ text-align:center; font-size:12px; color:var(--feltMuted); margin-top:-4px; }
.center{ flex:1 1 auto; padding:10px 14px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; text-align:center; min-height:230px; }
.center h2{ font-size:28px; }
.timer{ width:min(320px,80%); height:5px; border-radius:3px; background:rgba(255,255,255,.15); overflow:hidden; }
.timer i{ display:block; height:100%; background:var(--marigold); width:100%; }
.tlabel{ font-size:13px; color:var(--feltMuted); font-variant-numeric:tabular-nums; }
.trick{ display:flex; flex-wrap:wrap; justify-content:center; gap:10px; }
.played{ display:flex; flex-direction:column; align-items:center; gap:3px; font-size:13px; color:var(--feltMuted); max-width:76px; }
.played span{ max-width:76px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.status{ font-size:17px; }
.status b{ color:var(--marigold); font-weight:700; }
.ticker{ font-size:13px; color:var(--feltMuted); padding:0 14px 6px; min-height:20px; text-align:center; }

.card{ --w:52px; width:var(--w); height:calc(var(--w)*1.42); border-radius:8px; background:var(--card); color:var(--cardInk); border:0; padding:4px 0 0 5px;
  display:flex; flex-direction:column; align-items:flex-start; line-height:1; box-shadow:0 1px 0 rgba(0,0,0,.25), 0 3px 8px rgba(0,0,0,.18); flex:none; position:relative; }
.card .r{ font-weight:700; font-size:calc(var(--w)*.36); }
.card .s{ font-size:calc(var(--w)*.34); }
.card .big{ position:absolute; right:5px; bottom:3px; font-size:calc(var(--w)*.5); opacity:.9; }
.card.red{ color:var(--cardRed); }
.card.back{ background:repeating-linear-gradient(45deg,var(--rani) 0 6px,#9E1550 6px 12px); box-shadow:inset 0 0 0 3px var(--card), 0 2px 6px rgba(0,0,0,.2); }
.card.sm{ --w:40px; }
.card.lg{ --w:64px; }

.me{ background:var(--surface); color:var(--ink); border-top:1px solid var(--line); padding:8px 0 10px; }
.me .info{ display:flex; align-items:center; gap:8px; padding:0 12px 6px; font-size:15px; }
.me .info .pip{ box-shadow:inset 0 0 0 1.5px var(--muted); }
.me .info .pip.on{ background:var(--rani); box-shadow:none; }
.hand{ display:flex; overflow-x:auto; padding:14px 12px 6px; scroll-padding:12px; }
.hand .card{ --w:58px; margin-right:-16px; transition:transform .12s; }
.hand .card:last-child{ margin-right:0; }
.hand .card[aria-pressed="true"]{ transform:translateY(-12px); box-shadow:0 0 0 3px var(--marigold), 0 6px 12px rgba(0,0,0,.25); }
.hand .card.dim{ filter:grayscale(.6) brightness(.82); }
.hand .gap{ width:14px; flex:none; }
.actions{ display:flex; gap:8px; align-items:center; padding:6px 12px 0; flex-wrap:wrap; }
.actions .msg{ font-size:15px; flex:1 1 180px; }
.stepper{ display:inline-flex; align-items:center; gap:10px; }
.stepper button{ width:44px; height:44px; border-radius:50%; border:0; background:rgba(255,255,255,.14); color:var(--feltInk); font-size:22px; }
.stepper output{ font-family:var(--display); font-size:34px; min-width:40px; }
.prog{ display:grid; grid-template-columns:auto 1fr auto; gap:4px 10px; font-size:14px; width:min(360px,100%); text-align:left; }
.bar{ height:6px; border-radius:3px; background:rgba(255,255,255,.15); align-self:center; overflow:hidden; }
.bar i{ display:block; height:100%; background:var(--feltMuted); }
.order{ list-style:none; padding:0; margin:0; width:min(360px,100%); }
.order li{ display:flex; align-items:center; gap:8px; padding:6px 8px; border-bottom:1px solid var(--feltLine); text-align:left; }
.order li span{ flex:1; }
.order button{ width:40px; height:40px; border-radius:8px; border:0; background:rgba(255,255,255,.12); color:var(--feltInk); }
.draws{ display:flex; flex-wrap:wrap; gap:12px; justify-content:center; }
.scores{ border-collapse:collapse; font-size:15px; margin-top:6px; }
.scores td,.scores th{ padding:5px 10px; text-align:left; border-bottom:1px solid var(--feltLine); }
.scores th{ font-weight:500; color:var(--feltMuted); }

/* the award */
.award{ position:relative; width:min(420px,100%); padding:22px 18px 18px; border-radius:16px; background:var(--card); color:var(--cardInk);
  box-shadow:0 0 0 6px var(--marigold), 0 0 0 12px var(--rani), 0 14px 30px rgba(0,0,0,.35); margin:14px 0; }
.award .cap{ font-size:15px; color:#6A5B45; }
.award h2{ font-size:clamp(36px,10vw,52px); color:var(--rani); margin:2px 0 6px; }
.award .who{ font-family:var(--display); font-size:32px; }
.award .scores td,.award .scores th{ border-color:#E2D8C2; }
.award .scores th{ color:#6A5B45; }
.ass{ font-size:64px; line-height:1; }

/* sheets */
.sheet{ position:fixed; inset:0; background:rgba(0,0,0,.45); display:flex; align-items:flex-end; justify-content:center; z-index:20; }
.sheet > div{ background:var(--surface); color:var(--ink); width:min(640px,100%); max-height:86vh; overflow:auto; border-radius:18px 18px 0 0; padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px)); }
.sheet h2{ font-size:28px; margin-bottom:6px; }
.toast{ position:fixed; left:50%; transform:translateX(-50%); bottom:calc(20px + env(safe-area-inset-bottom,0px)); background:var(--ink); color:var(--page); padding:10px 16px; border-radius:10px; z-index:30; max-width:90vw; font-size:15px; }
.reactbar{ display:flex; gap:4px; }
.reactbar button{ border:0; background:rgba(255,255,255,.1); border-radius:20px; width:38px; height:34px; font-size:18px; }

/* v2 additions */
.av{ display:inline-grid; place-items:center; width:22px; height:22px; border-radius:50%; background:var(--c); color:#1A1206; font-weight:700; font-size:12px; flex:none; }
.seat{ border-top:3px solid var(--c); }
.seat .nm{ gap:5px; }
.ttl2{ font-size:12px; color:#FFB3CF; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ttl3{ font-size:13px; color:var(--rani); font-weight:500; }
.minirow{ display:flex; align-items:center; gap:4px; font-size:12px; color:var(--feltMuted); margin-top:4px; }
.card.mini{ --w:24px; padding:2px 0 0 3px; border-radius:4px; }
.card.mini .big{ display:none; }
.played{ position:relative; max-width:96px; }
.played .ord{ position:absolute; top:-8px; left:-8px; z-index:2; width:22px; height:22px; border-radius:50%; background:var(--c); color:#1A1206; font-size:12px; font-weight:700; display:grid; place-items:center; }
.played .card{ box-shadow:0 0 0 3px var(--c), 0 3px 8px rgba(0,0,0,.25); }
.played.hi .card{ box-shadow:0 0 0 3px var(--c), 0 0 0 7px var(--marigold), 0 6px 14px rgba(0,0,0,.35); }
.played .who{ display:inline-flex; align-items:center; gap:4px; margin-top:6px; padding:2px 8px 2px 2px; border-radius:20px; background:rgba(0,0,0,.28); color:var(--feltInk); font-size:13px; max-width:96px; }
.played .who .av{ width:18px; height:18px; font-size:11px; }
.played .who span:last-child{ overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.hitag{ font-size:11px; font-weight:700; color:#1E1606; background:var(--marigold); border-radius:6px; padding:0 6px; margin-top:4px; }
.trick{ gap:16px 14px; padding-top:8px; }
.titles{ padding-left:0; list-style:none; margin:8px 0 0; display:grid; gap:6px; }
.titles li{ display:grid; grid-template-columns:110px 1fr; align-items:center; gap:8px; }
select.lvl{ border:1.5px solid var(--line); border-radius:8px; background:var(--surface); padding:6px 8px; min-height:36px; }
.unread{ display:inline-block; min-width:18px; padding:0 5px; border-radius:9px; background:var(--rani); color:#fff; font-size:12px; font-weight:700; line-height:18px; text-align:center; }
.chatbtn{ margin-top:18px; }
.award .rank{ font-family:var(--display); font-size:22px; color:var(--rani); margin-top:-2px; }
#chat{ position:fixed; z-index:15; display:flex; flex-direction:column; background:var(--surface); color:var(--ink); }
#chat .head{ display:flex; align-items:center; gap:8px; padding:10px 12px; border-bottom:1px solid var(--line); }
#chat .head h2{ font-size:22px; flex:1; }
#chatlist{ flex:1 1 auto; overflow:auto; padding:10px 12px; display:flex; flex-direction:column; gap:8px; }
.cmsg{ display:flex; flex-direction:column; gap:2px; max-width:88%; }
.cmsg .from{ display:flex; align-items:center; gap:5px; font-size:12px; color:var(--muted); }
.cmsg .from .av{ width:16px; height:16px; font-size:10px; }
.cmsg .txt{ background:var(--page); border-left:3px solid var(--c); padding:6px 10px; border-radius:4px 10px 10px 4px; overflow-wrap:anywhere; }
.cmsg.mine{ align-self:flex-end; align-items:flex-end; }
.cmsg.mine .txt{ border-left:0; border-right:3px solid var(--c); border-radius:10px 4px 4px 10px; }
#chat .send{ display:flex; gap:8px; padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px)); border-top:1px solid var(--line); }
#chat .send input{ flex:1; }
@media (max-width: 899px){
  #chat{ left:0; right:0; bottom:0; height:min(70vh,560px); border-radius:18px 18px 0 0; box-shadow:0 -10px 30px rgba(0,0,0,.3); transform:translateY(105%); transition:transform .2s; }
  #chat.open{ transform:none; }
  #chat:not(.open){ visibility:hidden; transition:transform .2s, visibility 0s .2s; }
}
@media (min-width: 900px){
  body.inroom #app{ margin-right:340px; }
  #chat{ right:0; top:6px; bottom:0; width:340px; border-left:1px solid var(--line); }
  #chat .closer, .chatchip, .chatbtn, .chatbtn2{ display:none; }
  #game{ max-width:1000px; margin:0 auto; }
  .center{ min-height:340px; }
  .card.lg{ --w:76px; }
  .seat{ padding:10px 12px; }
}


/* v3: story, tracker, conspiracy */
.strip{ display:flex; align-items:center; gap:6px; padding:0 10px 8px; overflow-x:auto; }
.strip .chip{ flex:none; }
.stripevs{ display:flex; gap:6px; }
.sev{ display:inline-flex; align-items:center; gap:3px; padding:3px 8px 3px 5px; border-radius:16px; background:rgba(0,0,0,.25); border-bottom:2px solid var(--c); font-size:13px; flex:none; }
.sev .av{ width:18px; height:18px; font-size:10px; }
.sev b{ color:var(--marigold); }
.banner{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:center; max-width:min(520px,100%); padding:10px 14px; border-radius:14px; background:rgba(0,0,0,.32); border:2px solid var(--c); font-size:15px; animation:bannerLife 7s ease forwards; }
.banner .bi{ font-size:26px; }
.banner.b-cut{ border-color:var(--rani); }
.banner .arrow, .ev .arrow{ color:var(--marigold); font-weight:700; }
@keyframes bannerLife{ 0%{ transform:scale(.85); opacity:0 } 6%{ transform:scale(1.04); opacity:1 } 12%{ transform:scale(1) } 85%{ opacity:1 } 100%{ opacity:.0 } }
.fx{ display:inline-block; margin-top:4px; font-size:12px; font-weight:700; padding:1px 7px; border-radius:10px; background:var(--marigold); color:#1E1606; animation:fxLife 6s ease forwards; }
.fx-cut-to{ background:var(--rani); color:#fff; }
.fx-out{ background:var(--ok); color:#fff; }
@keyframes fxLife{ 0%{ transform:scale(.6); opacity:0 } 8%{ transform:scale(1.15); opacity:1 } 16%{ transform:scale(1) } 80%{ opacity:1 } 100%{ opacity:0 } }
.ev{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; padding:8px 0; border-bottom:1px solid var(--line); font-size:15px; }
.ev .evi{ font-size:20px; width:26px; text-align:center; }
.ev .evt{ flex:1 1 200px; }
.evcards{ display:flex; gap:3px; }
.whisper{ margin:6px 12px 0; padding:8px 12px; border-radius:12px; background:#2B1630; color:#F6DDF0; font-size:15px; border-left:4px solid var(--rani); }
.risk{ margin:6px 12px 0; display:flex; flex-wrap:wrap; gap:6px; align-items:center; font-size:14px; color:var(--muted); }
.rk{ display:inline-flex; align-items:center; gap:4px; padding:2px 8px 2px 3px; border-radius:14px; box-shadow:inset 0 0 0 1.5px var(--line); color:var(--ink); }
.rk .av{ width:18px; height:18px; font-size:10px; }
.rk.warm{ box-shadow:inset 0 0 0 1.5px var(--marigold); }
.rk.hot{ background:var(--rani); color:#fff; box-shadow:none; }
.sheet .risk{ margin:6px 0; }
table.trk{ border-collapse:collapse; width:100%; font-size:14px; margin-top:8px; }
.trk th,.trk td{ padding:6px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
.trk th{ font-weight:500; text-align:center; }
.trk td.pv{ text-align:center; font-variant-numeric:tabular-nums; border-radius:6px; }
.pv.cool{ color:var(--muted); }
.pv.warm{ background:rgba(242,165,22,.22); }
.pv.hot{ background:rgba(200,29,99,.28); font-weight:700; }
.pv.sure{ background:var(--rani); color:#fff; font-weight:700; }
.trk .av{ width:20px; height:20px; font-size:11px; vertical-align:middle; }

}

/* ===== Landscape phones: everything on one screen ===== */
@media (orientation: landscape) and (max-height: 600px) {
  :root{ padding-left:env(safe-area-inset-left,0px); padding-right:env(safe-area-inset-right,0px); }
  .stripe{ height:4px; }
  body.inroom #app{ margin-right:0; }
  /* chat becomes a side drawer */
  #chat{ left:auto; right:0; top:0; bottom:0; width:min(380px,48vw); height:auto; border-radius:0; border-left:1px solid var(--line); box-shadow:-10px 0 30px rgba(0,0,0,.3); transform:translateX(105%); transition:transform .2s, visibility 0s .2s; }
  #chat.open{ transform:none; visibility:visible; transition:transform .2s; }
  #chat:not(.open){ visibility:hidden; }
  #chat .closer, .chatchip, .chatbtn{ display:inline-flex; }
  .sheet > div{ max-height:92vh; width:min(720px,100%); }

  /* game: players on the left, play area on the right */
  #game{ display:grid; grid-template-columns:minmax(0,1fr) minmax(300px,1.08fr); grid-template-rows:auto auto minmax(0,1fr) auto auto; }
  #game .topbar{ grid-column:1 / -1; grid-row:1; padding:4px 10px; gap:6px; }

  #game .chip{ min-height:30px; padding:3px 10px; font-size:13px; }

  #game .watchbar{ grid-column:2; grid-row:2; margin:0 10px 4px; }
  #game .seats{ grid-column:1; grid-row:2 / 5; grid-template-columns:repeat(2, minmax(0,1fr)); align-content:start; overflow:visible; min-height:0; padding:2px 8px 4px; gap:6px; }
  #game .dir{ grid-column:1; grid-row:5; align-self:end; margin:0 0 4px; font-size:12px; }
  #game .center{ grid-column:2; grid-row:3; padding:6px 10px; gap:6px; }
  #game .center h2{ font-size:22px; }
  #game .center .status{ font-size:15px; margin:2px 0; }
  #game .center .card.lg{ --w:44px; }
  #game .center .trick{ gap:10px 8px; padding-top:6px; }
  #game .center .banner{ padding:6px 10px; font-size:13px; }
  #game .center .banner .bi{ font-size:20px; }
  #game .center .ass{ font-size:32px; }
  #game .center .award{ padding:10px 12px 8px; margin:8px 0; }
  #game .center .award h2{ font-size:28px; }
  #game .center .award .who{ font-size:22px; }
  #game .center .seriesban{ font-size:14px; padding:6px 10px; }
  #game .center .stepper button{ width:38px; height:38px; }
  #game .center .stepper output{ font-size:26px; }
  #game .strip{ grid-column:2; grid-row:4; padding:2px 10px 4px; }
  #game .chatline{ grid-column:1; grid-row:4; align-self:end; margin:0 8px 6px; z-index:2; }
  #game .me{ grid-column:2; grid-row:5; max-height:64vh; padding:4px 0 6px; border-top:0; border-radius:14px 0 0 0; }
  #game .me .info{ padding:0 10px 2px; font-size:14px; }
  #game .myhist{ padding:0 10px; }
  #game .hand{ padding:12px 10px 4px; }
  #game .hand .card{ --w:46px; margin-right:-14px; }
  #game .hand .card[aria-pressed="true"]{ transform:translateY(-9px); }
  #game .actions{ padding:4px 10px 0; gap:6px; }
  #game .actions .msg{ font-size:13px; flex-basis:120px; }
  #game .actions .btn{ min-height:38px; padding:6px 12px; }
  #game .risk, #game .whisper{ margin:4px 10px 0; font-size:13px; }
  #game .whisper{ padding:5px 10px; }
  #game .seat .hist .card.mini{ --w:22px; }

  /* lobby and home in two columns to cut scrolling */
  .wrap.lobby{ max-width:none; column-count:2; column-gap:28px; padding:4px 18px 0; }
  .wrap.lobby > *{ break-inside:avoid; }
  .wrap.lobby section.blk{ margin-top:12px; }
  #home{ max-width:none; display:grid; grid-template-columns:1fr 1.2fr; gap:0 28px; align-items:center; min-height:calc(100dvh - 14px); padding:2px 18px; }
  #home .hero{ padding:0; }
  #home h1{ font-size:clamp(34px, 6vw, 52px); }
  .homeform{ margin-top:0; gap:8px; }
  .homeform .choice{ padding:8px 12px; }
  .homeform .choice > .row:has([data-a="create"]){ display:inline-flex; margin-right:8px; vertical-align:middle; }
  .homeform .joinrow{ display:inline-flex; margin-top:6px; vertical-align:middle; }
  .homeform .joinrow input{ width:110px; }
  #home > section.blk{ grid-column:1 / -1; }

  /* give the middle panel room when it's not your move */
  #game:not(.ph-TURN) .hand .card{ --w:34px; margin-right:-10px; }
  #game:not(.ph-TURN) .hand{ padding-top:4px; }
  #game .myhist .hist{ flex-wrap:nowrap; overflow-x:auto; }
  #game .myhist .card.mini{ --w:20px; }
  #game.ph-TURN .actions .btn.small{ min-height:32px; padding:3px 9px; font-size:13px; }
  #game .myhist .hist .note{ white-space:nowrap; }
  #game.ph-TURN .actions .msg{ font-size:12px; line-height:1.3; }
}



/* v6: commentary, throws, showdown, Hall of Shame */
#game .dir{ min-height:32px; display:flex; align-items:center; justify-content:center; gap:8px; padding:0 10px; }
.mic-idle{ flex:none; border:0; width:28px; height:28px; border-radius:50%; background:rgba(255,255,255,.1); font-size:14px; display:grid; place-items:center; padding:0; }
.mic{ display:flex; align-items:center; gap:8px; width:min(580px,100%); border:0; text-align:left; padding:3px 10px 3px 3px; border-radius:999px;
  background:rgba(0,0,0,.28); box-shadow:inset 0 0 0 1.5px rgba(242,165,22,.55); color:var(--feltInk); font-size:14px; line-height:1.25; animation:micLife 12s ease forwards; }
.mic.big{ background:rgba(200,29,99,.38); box-shadow:inset 0 0 0 2px var(--marigold); font-weight:500; }
.mic .mav{ flex:none; width:28px; height:28px; border-radius:50%; background:var(--marigold); display:grid; place-items:center; font-size:15px; }
.mic .mav.talk{ animation:talk .5s ease-in-out infinite alternate; }
.mic .mname{ flex:none; font-family:var(--display); color:var(--marigold); font-size:15px; }
.mic .mline{ flex:1; min-width:0; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.mic .mvol{ flex:none; font-size:12px; opacity:.75; }
@keyframes micLife{ 0%{ transform:translateY(5px); opacity:0 } 2.5%{ transform:none; opacity:1 } 88%{ opacity:1 } 100%{ opacity:0 } }
@keyframes talk{ from{ transform:scale(1); box-shadow:0 0 0 0 rgba(242,165,22,.6) } to{ transform:scale(1.08); box-shadow:0 0 0 5px rgba(242,165,22,0) } }
@media (max-width:480px){ .mic .mname{ display:none; } .mic{ font-size:13px; } }
#game.showdown{ box-shadow:inset 0 0 0 3px var(--rani), inset 0 0 110px rgba(200,29,99,.42); }
#game.showdown .seat:not(.done){ border-color:var(--rani); animation:sdPulse 1.4s ease-in-out infinite; }
#game.showdown .seat.turn{ border-color:var(--marigold); }
@keyframes sdPulse{ 50%{ box-shadow:0 0 18px rgba(200,29,99,.65); } }
.throws{ display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:6px; margin:8px 0 6px; }
.throw{ display:flex; flex-direction:column; align-items:center; gap:2px; border:0; border-radius:12px; padding:8px 2px; min-height:64px; background:var(--page); box-shadow:inset 0 0 0 1.5px var(--line); font-size:13px; font-weight:500; }
.throw span{ font-size:26px; line-height:1; }
.throw:active{ transform:scale(.94); }
.proj{ position:fixed; left:0; top:0; z-index:40; font-size:34px; pointer-events:none; will-change:transform; }
.hit{ position:fixed; z-index:41; transform:translate(-50%,-50%); pointer-events:none; display:grid; place-items:center; width:110px; height:80px; animation:hitLife 1.9s ease forwards; }
.hit b{ position:relative; font-family:var(--display); font-weight:400; font-size:24px; color:#fff; text-shadow:0 2px 0 var(--rani), 0 0 10px rgba(0,0,0,.55); transform:rotate(-8deg); }
.hit-gulaab b{ font-size:34px; text-shadow:none; }
.hit .blob{ position:absolute; inset:0; background:radial-gradient(circle at 42% 45%, #E3342F 0 30%, transparent 31%), radial-gradient(circle at 70% 62%, #B91C1C 0 18%, transparent 19%), radial-gradient(circle at 20% 72%, #E3342F 0 11%, transparent 12%), radial-gradient(circle at 82% 22%, #E3342F 0 8%, transparent 9%), radial-gradient(circle at 30% 18%, #B91C1C 0 6%, transparent 7%); }
.hit .blob.egg{ background:radial-gradient(circle at 50% 50%, #F6C13B 0 15%, #FFF8E6 16% 36%, transparent 37%), radial-gradient(circle at 78% 70%, #FFF8E6 0 10%, transparent 11%), radial-gradient(circle at 24% 30%, #FFF8E6 0 8%, transparent 9%); }
@keyframes hitLife{ 0%{ transform:translate(-50%,-50%) scale(.3); opacity:0 } 10%{ transform:translate(-50%,-50%) scale(1.15); opacity:1 } 75%{ opacity:1 } 100%{ transform:translate(-50%,-50%) scale(1); opacity:0 } }
.seat.shake{ animation:shake .45s; }
@keyframes shake{ 20%{ transform:translateX(-5px) rotate(-2deg) } 40%{ transform:translateX(5px) rotate(2deg) } 60%{ transform:translateX(-3px) } 80%{ transform:translateX(3px) } }
.wrapseg{ flex-wrap:wrap; }
.shame{ position:relative; margin-top:10px; padding:18px 16px 14px; border-radius:16px; background:var(--card); color:var(--cardInk); text-align:center; overflow:hidden; }
.shame .stamp{ position:absolute; right:-6px; top:-10px; font-size:76px; transform:rotate(14deg); opacity:.22; }
.shame .cap{ font-size:14px; color:#6A5B45; }
.shame .who{ font-family:var(--display); font-size:clamp(30px,9vw,42px); color:var(--rani); line-height:1.1; margin:2px 0; }
.tblwrap{ overflow-x:auto; }
.hallt{ width:100%; border-collapse:collapse; font-size:15px; margin-top:6px; }

.hallt .num{ text-align:right; font-variant-numeric:tabular-nums; }

<script>
/* Donkey of the Day — authoritative rules engine (rule version 0.1 defaults) */
(function (root) {

  const T = { seatDraw: 4500, seatOrder: 45000, dealerDraw: 4500, batch: 15000, dealTotal: 120000,

  function cardSort(a, b) { return SUITS.indexOf(suitOf(a)) - SUITS.indexOf(suitOf(b)) || rankOf(a) - rankOf(b); }
  const lowestByOrder = cards => cards.slice().sort((a, b) => rankOf(a) - rankOf(b) || SUITS.indexOf(suitOf(a)) - SUITS.indexOf(suitOf(b)))[0];

  function log(st, msg) { st.log.push(msg); if (st.log.length > 12) st.log.shift(); }
  function ev(st, e, now) { st.events = st.events || []; e.t = now; e.h = st.handNo; e.id = (st.evSeq = (st.evSeq || 0) + 1); st.events.push(e); if (st.events.length > 40) st.events.shift(); }

  const SN = s => '[[' + s + ']]';

  function draw(contenders, rand, wantHigh) {
    const rounds = []; let c = contenders.slice();

      const deck = shuffle(fullDeck(), rand); const r = {};

  }

  function createMatch(o) {
    const rand = o.rand || secureRand; const now = o.now;
    const st = { rv: '0.1', v: 1, matchId: o.matchId || ('m' + now.toString(36)), mode: o.mode || 'single', tz: o.tz || 'UTC',

    st.levels = {}; st.titleOf = {}; st.target = [2, 3, 5].includes(o.target) ? o.target : 5;

    st.style = {};
    { const f = o.fun || {}; st.opts = { shuffle: !!f.shuffle, powers: !!f.powers, blitz: !!f.blitz, bets: !!f.bets }; st.turnMs = st.opts.blitz ? 10000 : T.turn; ensure25(st); }
    o.players.forEach(p => { st.names[p.uid] = p.name; st.bots[p.uid] = !!p.bot; st.losses[p.uid] = 0; if (p.bot) st.levels[p.uid] = p.level || 'medium'; });
    const d = draw(st.lobby, rand, true);

  function startHand(st, now, rand) {

    st.finished = {}; st.ready = {}; st.pauseFor = null; st.seen = {}; st.voids = {}; st.known = {}; st.ledBy = {}; st.cutWith = {}; st.shedSeen = {}; st.playedBy = {}; st.highBy = {}; st.trickNo = 0; st.finalView = null;

  function nextRecipient(st, from) {

  }
  function finishDeal(st, now) {

    if (st.shuf) st.shuf.shape = st.seats.map(u => { const c = {}; st.hands[u].forEach(x => c[suitOf(x)] = (c[suitOf(x)] || 0) + 1); const s = Object.keys(c).sort((a, b) => c[b] - c[a])[0]; return { u, s, n: c[s] || 0, voids: SUITS.filter(x => !c[x]).length }; });

  }
  function activeIdx(st) { return st.seats.map((u, i) => i).filter(i => st.hands[st.seats[i]].length > 0); }

  async refreshActions(code) { try { const s = await this.db.collection('rooms/' + code + '/actions').get(); s.docs.forEach(d => d.exists && App.host.remoteAction(d.id, d.data())); } catch (e) {} },

function colorOf(u) { const p = App.pub; const list = (p.match && p.match.lobby) || (p.lobby.members || []).map(x => x.uid); const i = list.indexOf(u); return SEAT_COLORS[(i < 0 ? 0 : i) % 5]; }

  return `<button type="button" class="card ${red ? 'red' : ''} ${cls}" aria-label="${cardName(c)}" data-card="${c}" ${attrs}><span class="r">${c.slice(2)}</span><span class="s">${SUITSYM[c[0]]}</span><span class="big" aria-hidden="true">${SUITSYM[c[0]]}</span></button>`;
}

const App = {

  /* ----- entering rooms ----- */
  setName() { const v = ($('#nm') && $('#nm').value.trim().slice(0, 24)) || ''; if (!v) { this.homeMsg = 'Enter a display name first.'; this.render(); return false; } this.name = v; LS.set('dotd-name', v); return true; },

  /* ----- state in ----- */
  receive(doc, hand, hint, extra) { this.pub = doc; this.hand = hand || []; this.hint = hint || null; this.extra = extra || null; this.offset = 0; this.lastRecv = Date.now(); this.afterPub(); },
  async onPub(doc) {

  afterPub() {

  musicBlock() {

  async addSong(file) {

  /* any format the browser can decode becomes a 60-second clip recorded in a storable container */

  tickUI() {

/* ---------- views ---------- */
function rulesHTML(open = true) {
  return `<details class="rules" ${open ? 'open' : ''}><summary>Rules</summary><ol>
<li>Four or five players, one 52-card deck, no jokers or trumps. Ace is high, 2 is low.</li>
<li>Everyone draws a card. The highest draw arranges the seats; a second draw makes the lowest card the first dealer. Ties redraw.</li>
<li>The dealer deals clockwise in batches of their choice, from one card to a player’s whole share. With five players, 2 extra cards go to one player (or one each to two players, if the host chooses that). The extra-card seat moves one place clockwise every hand.</li>
<li>The Ace of Spades opens the first trick. Everyone must follow the led suit if they can.</li>
<li>If everyone follows, the trick is discarded and the highest card of the led suit leads next, with any card.</li>
<li>If you can’t follow, you cut: give one or more cards of a single other suit. The table pile and your cards go to whoever played the highest card of the led suit. Everyone sees them for 20 seconds, then you lead next.</li>
<li>Run out of cards and you’re safe for this hand. The last player holding cards is the Donkey, takes a loss and deals next.</li>
<li>The host declares the series before the match: first to 2, 3 or 5 Donkey losses, consecutive or not, becomes Donkey of the Day, dated in the room’s timezone.</li></ol></details>
<details class="rules"><summary>Proposed house-rule defaults in this version</summary><ul>
<li>A cut is allowed on the opening Spades trick too.</li>
<li>Emptying your hand only counts once the trick or pickup finishes, so your last card can still collect a pickup.</li>
<li>If the player who should lead is out, the lead passes clockwise.</li>
<li>If everyone empties on the final trick, the highest card of that trick takes the loss.</li>
<li>If the same position comes round three times in one hand, it’s a stalemate: whoever holds the most cards takes the loss (the player due to lead, on a tie).</li>
<li>30 seconds per move. When time runs out, your lowest legal card is played, or one lowest card is cut. After two automatic moves in a row the game pauses up to 2 minutes for you, then ends without an award.</li>
<li>Music is required: the host picks a track and every player turns audio on before Ready. You may mute or lower your own volume.</li></ul></details>`;
}

function foldSections(html) {

    if (/^Players/.test(t)) return all;
    parts.push(`<section class="sub"><h3>${t}</h3>${body}</section>`); return '\u0000';
  });
  const i = html.indexOf('\u0000'); if (i < 0) return html;
  html = html.replace(/\u0000/g, '');
  const fold = `<details class="set" data-set="Room settings" ${App.openSets.has('Room settings') ? 'open' : ''}><summary>Room settings</summary>${parts.join('')}</details>`;
  return html.slice(0, i) + fold + html.slice(i);
}

    return `<h2>You’re dealing</h2>${this.shufLine(m)}<p style="margin:0">${s.secret ? 'Secret deal plan: tap Deal and the cards go out the right way.' : `<b>${DEAL_NAME[d]}</b>: ${d === 'all' ? 'each player gets their whole share in one go' : d === 1 ? 'one card to each player in turn' : d + ' cards to each player in turn'}.`}</p>
      <p style="margin:6px 0 0">Next: ${n ? n + ' to ' : 'cards to '}${ru === me ? 'you' : '<b>' + esc(nameOf(ru)) + '</b>'}.</p>
      <div class="row" style="justify-content:center"><button class="btn gold" data-a="v7-plan" ${App.pending ? 'disabled' : ''}>${n ? 'Deal ' + n : 'Deal next batch'}</button><button class="btn alt" data-a="v7-plan-rest" ${App.pending ? 'disabled' : ''}>Deal the rest</button></div>
      ${prog}${timerHTML(m.deadline, T.batch)}<div class="tlabel">If time runs out, the rest is dealt the same way.</div>`;
  },
  dealStyles(left) { return `<div class="row dealstyles" style="justify-content:center">${[['1', 'Ek-Ek Karke'], ['3', 'Thok Ke 3'], ['5', 'Thok Ke 5'], ['all', 'Poora Ek Saath']].map(([k, l]) => `<button class="btn alt small" data-a="v7-deal" data-k="${k}" ${App.pending ? 'disabled' : ''}>${l}${k === 'all' ? ' (' + left + ')' : ''}</button>`).join('')}</div>`; },
  handExtras(m) {
    const s = m.shuf, r = m.lastResult; let h = '';
    if (s && s.actual) { const sh = (s.shape || []).slice().sort((a, b) => b.n - a.n), top = sh[0];
      h += `<div class="shufsum"><div>🔀 <b>${SHUF_INFO[s.actual].n}</b>${s.mode === 'marzi' ? ' (Gadhe Ki Marzi)' : ''}, dealt <b>${DEAL_NAME[s.deal] || ''}</b>, by ${esc(V7.nick(s.by))}${s.cut ? ', ' + (s.cut.kind === 'knock' ? 'no cut' : s.cut.kind === 'double' ? 'Double Kaat' : 'cut at ' + s.cut.at) : ''}.</div>
      ${top ? `<div>Longest suit dealt: <b>${esc(nameOf(top.u))}</b> got ${top.n} ${suitName(top.s)}.${sh.filter(x => x.voids).length ? ' Dealt a void: ' + sh.filter(x => x.voids).map(x => esc(shortName(x.u))).join(', ') + '.' : ''}</div>` : ''}</div>`; }
    const bets = r && r.bets ? Object.entries(r.bets) : [];
    if (bets.length) h += `<div class="shufsum">🎲 ${bets.map(([b, p]) => `${esc(shortName(b))} bet on ${esc(shortName(p))} ${p === r.uid ? '✅' : '❌'}`).join(' · ')}</div>`;
    return h;
  },
  comeback(m) { const a = m.award; if (!a) return ''; const cb = m.seats.filter(u => u !== a.uid && m.losses[u] === m.target - 1);
    return cb.length ? `<p class="badgeline">🔥 Comeback badge: ${cb.map(u => '<b>' + esc(nameOf(u)) + '</b>').join(', ')} survived at ${m.target - 1} losses.</p>` : ''; },
  /* ----- your area: magic cards, peek, bets ----- */
  meHTML(m) {
    if (!m.opts || !m.seats || !m.names[App.uid]) return ''; const me = App.uid, inHand = ['TURN', 'TRICK_END', 'CUT_REVEAL'].includes(m.phase); let h = '';
    const pk = App.extra && App.extra.peek; if (pk) h += `<div class="peekinfo">👁️ You peeked: <b>${esc(shortName(pk.to))}</b> holds ${cardStatic(pk.c, 'mini')}</div>`;
    const pw = (m.powers || {})[me] || [];
    if (m.opts.powers && pw.length && App.hand.length) h += `<div class="powers" role="group" aria-label="Your magic cards">${pw.map(k => { const P = POWER_INFO[k], ok = inHand && !App.pending && (k !== 'swap' || (m.phase === 'TURN' && m.actor === me)) && !(k === 'shield' && (m.shield || []).includes(me)) && !(k === 'reverse' && m.reverseNext);
      return `<button class="pw" data-a="v7-power" data-k="${k}" ${ok ? '' : 'disabled'} title="${P.d}"><span aria-hidden="true">${P.i}</span>${P.n}</button>`; }).join('')}</div>`;
    if (m.opts.bets && inHand && !App.hand.length && m.counts) { const act = m.seats.filter(u => m.counts[u] > 0); const mine = (m.bets || {})[me];
      if (act.length >= 2) h += `<div class="betbar">${mine ? `🎲 You bet on <b>${esc(nameOf(mine))}</b>. Fingers crossed.` : `🎲 Bet on the Donkey: ${act.map(u => `<button class="btn alt small" data-a="v7-bet" data-u="${esc(u)}">${avatar(u)} ${esc(shortName(u))}</button>`).join('')}`}</div>`; }
    return h;
  },
  /* ----- seats: punishments, shields, magic counts ----- */
  punished(m, u) { const r = m.lastResult; return !!(r && r.uid === u && m.handNo === r.handNo + 1); },
  seatCls(m, u) { return this.punished(m, u) ? 'punished' : ''; },
  orn(m, u) { let h = ''; if (this.punished(m, u)) h += m.lastResult.handNo % 2 ? '<span class="orn ears" title="Donkey ears for one hand" aria-label="Wearing donkey ears">🫏</span>' : '<span class="orn garland" title="Chappal garland for one hand" aria-label="Wearing a chappal garland">🩴🩴🩴🩴</span>';
    const sh = (m.shield || []).includes(u), pw = ((m.powers || {})[u] || []).length; if (sh || pw) h += `<span class="mag" aria-label="${sh ? 'Shield up. ' : ''}${pw} magic card${pw === 1 ? '' : 's'}">${sh ? '🛡️' : ''}${pw ? '✨' + pw : ''}</span>`; return h; },
  muted() { const m = App.pub && App.pub.match; return !!(this.fun().mute && m && m.names && this.punished(m, App.uid)); },
  /* ----- story lines ----- */
  evText(e) {
    switch (e.k) {
      case 'shuffle': return `${who(e.u)} shuffled${e.mode ? ' with ' + SHUF_INFO[e.mode].n : ' in secret'}.`;
      case 'deckcut': return `${who(e.u)} ${e.kind === 'knock' ? 'knocked: no cut' : e.kind === 'double' ? 'did a Double Kaat' : 'cut the deck at ' + e.at}.`;
      case 'bottom': return `${who(e.u)} showed the bottom card: ${short(e.c)}.`;
      case 'earn': return `${who(e.u)} went out first and earned ${POWER_INFO[e.p].i} ${POWER_INFO[e.p].n}.`;
      case 'power': return `${who(e.u)} used ${POWER_INFO[e.p].i} ${POWER_INFO[e.p].n}${e.to ? ' on ' + who(e.to) : ''}.`;
      case 'shielded': return `${who(e.u)}’s shield blocked ${who(e.to)}’s cut. The cards went to the discard pile.`;
      case 'bet': return `${who(e.u)} bet that ${who(e.to)} will be the Donkey.`;
    }
    return '';
  },
  /* ----- lobby ----- */
  lobbyHTML(L, H) {
    const F = L.fun || {}, tog = (k, l, d) => `<div class="funrow"><div class="grow"><b>${l}</b><div class="note">${d}</div></div>${H ? `<span class="seg"><button data-a="v7-fun" data-k="${k}" data-v="0" aria-pressed="${!F[k]}">Off</button><button data-a="v7-fun" data-k="${k}" data-v="1" aria-pressed="${!!F[k]}">On</button></span>` : `<span class="tagp ${F[k] ? 'go' : ''}">${F[k] ? 'On' : 'Off'}</span>`}</div>`;
    const sp = [['device', 'Each phone'], ['off', 'Off'], ['halka', 'Halka'], ['teekha', 'Teekha']];
    const nick = L.nick || {}, jokes = L.jokes || [];
    return `<section class="blk"><h2>Fun rules</h2>
      ${tog('shuffle', 'Donkey’s Shuffle Power', 'The Donkey picks the shuffle, the player on their left cuts the deck.')}
      ${tog('powers', 'Magic cards', 'First one out each hand earns Peek, Shield, Swap or Reverse.')}
      ${tog('blitz', 'Blitz', '10 seconds per move instead of 90.')}
      ${tog('bets', 'Bet on the Donkey', 'Players who are out guess who loses the hand.')}
      ${tog('mute', 'Mute the Donkey', 'The Donkey can’t chat during the next hand.')}
      <div class="funrow"><div class="grow"><b>Commentary spice for the room</b><div class="note">Each phone lets everyone choose for themselves.</div></div></div>
      ${H ? `<span class="seg wrapseg">${sp.map(([k, l]) => `<button data-a="v7-spice" data-k="${k}" aria-pressed="${(F.spice || 'device') === k}">${l}</button>`).join('')}</span>` : `<p class="note">${(sp.find(x => x[0] === (F.spice || 'device')) || sp[0])[1]}</p>`}</section>
    <details class="set" data-set="Nicknames" ${App.openSets.has('Nicknames') ? 'open' : ''}><summary>Nicknames and inside jokes</summary>
      <p class="note">Nicknames show in commentary. Anyone can nickname anyone.</p>
      ${(L.members || []).map(x => `<div class="row nickrow">${avatar(x.uid)}<span class="nm">${esc(x.name)}</span><input id="nick-${esc(x.uid)}" class="t grow" maxlength="20" placeholder="Nickname" value="${esc(nick[x.uid] || '')}" aria-label="Nickname for ${esc(x.name)}"><button class="btn alt small" data-a="v7-nick" data-u="${esc(x.uid)}">Save</button></div>`).join('')}
      <h3 style="font-size:20px;margin-top:14px">Inside jokes</h3><p class="note">The commentator slips these in. Use {u} for the player in the moment.</p>
      <ul class="jokes">${jokes.map((j, i) => `<li><span class="grow">${esc(j.x)}</span>${H ? `<button class="btn alt small" data-a="v7-joke-del" data-i="${i}" aria-label="Delete joke">✕</button>` : ''}</li>`).join('') || '<li class="note">No jokes yet.</li>'}</ul>
      <div class="row"><input id="jokein" class="t grow" maxlength="120" placeholder="{u} ki chai phir thandi ho gayi" aria-label="New inside joke"><button class="btn small" data-a="v7-joke">Add</button></div></details>`;
  },
  /* ----- scores: stats and rivalries ----- */
  statsHTML(m) {
    const S = m.stats; if (!S || !m.seats) return '';
    const rows = m.seats.map(u => ({ u, cuts: S.cuts[u] || 0, cards: S.cards[u] || 0, big: S.big[u] || 0, best: S.best[u] || 0, first: S.first[u] || 0, bet: (m.betPts || {})[u] || 0 }));
    const riv = Object.entries(S.rival).map(([k, n]) => { const [a, b] = k.split('>'); return { a, b, n, back: S.rival[b + '>' + a] || 0 }; }).filter(x => x.a < x.b || !S.rival[x.b + '>' + x.a]).sort((x, y) => (y.n + y.back) - (x.n + x.back)).slice(0, 3);
    return `<h3 style="font-size:20px;margin-top:14px">Stats this match</h3><div class="tblwrap"><table class="hallt"><thead><tr><th>Player</th><th>Cuts</th><th>Cards dumped</th><th>Biggest</th><th>Safe streak</th><th>First out</th>${m.opts && m.opts.bets ? '<th>Bets won</th>' : ''}</tr></thead>
      <tbody>${rows.map(r => `<tr><td>${esc(shortName(r.u))}</td><td class="num">${r.cuts}</td><td class="num">${r.cards}</td><td class="num">${r.big}</td><td class="num">${r.best}</td><td class="num">${r.first}</td>${m.opts && m.opts.bets ? `<td class="num">${r.bet}</td>` : ''}</tr>`).join('')}</tbody></table></div>
      ${riv.length ? `<h3 style="font-size:20px;margin-top:14px">Rivalries</h3>${riv.map(x => `<div class="ev">${avatar(x.a)}<b>${esc(shortName(x.a))}</b> cut <b>${esc(shortName(x.b))}</b> ${x.n}× · ${esc(shortName(x.b))} hit back ${x.back}×</div>`).join('')}` : ''}`;
  },
  click(a, b) {
    const m = App.pub && App.pub.match;
    switch (a) {
      case 'v7-shuf': App.shufPick = b.dataset.k; App.render(); return true;
      case 'v7-shuf-go': if (App.shufPick) { App.send('SHUFFLE_PICK', { mode: App.shufPick, secret: !!App.shufSecret || App.shufPick === 'marzi' }); App.shufPick = null; App.shufSecret = false; } return true;
      case 'v7-cut': App.send('DECK_CUT', { kind: b.dataset.k, at: App.cutAt || 26, peek: !!App.cutPeek }); App.cutAt = 26; App.cutPeek = false; return true;
      case 'v7-plan': App.send('DEAL_BATCH', { plan: true }); return true;
      case 'v7-plan-rest': App.send('DEAL_BATCH', { rest: true }); return true;
      case 'v7-deal': { const r = m.dealTo, left = m.quotas[r] - m.dealt[r], k = b.dataset.k; App.send('DEAL_BATCH', { count: k === 'all' ? left : Math.min(+k, left) }); return true; }
      case 'v7-power': { const k = b.dataset.k; if (k === 'peek') { App.openSheet('v7-peek'); return true; } V7.sendPower(k); return true; }
      case 'v7-peek-at': App.closeSheet(); V7.sendPower('peek', b.dataset.u); return true;
      case 'v7-bet': App.send('BET', { pick: b.dataset.u }); return true;
      case 'v7-fun': App.send('SET_FUN', { k: b.dataset.k, v: b.dataset.v === '1' }); return true;
      case 'v7-spice': App.send('SET_FUN', { k: 'spice', v: b.dataset.k }); return true;
      case 'v7-nick': { const i = document.getElementById('nick-' + b.dataset.u); App.send('SET_NICK', { u: b.dataset.u, x: i ? i.value : '' }); App.toast('Nickname saved.'); return true; }
      case 'v7-joke': { const i = $('#jokein'); if (i && i.value.trim()) { App.send('ADD_JOKE', { x: i.value }); i.value = ''; } return true; }
      case 'v7-joke-del': App.send('DEL_JOKE', { i: +b.dataset.i }); return true;
      case 'v7-progress': App.openSheet('v7-prog'); return true;
      case 'v7-theme': Prog.setTheme(b.dataset.k, null); return true;
      case 'v7-back': Prog.setTheme(null, b.dataset.k); return true;
    }
    return false;
  },
  peekSheet() { const m = App.pub.match; const ts = m.seats.filter(u => u !== App.uid && m.counts[u] > 0);
    return `<h2>👁️ Peek</h2><p>Pick whose hand to peek into. Only you see the card.</p><div class="row">${ts.map(u => `<button class="btn alt" data-a="v7-peek-at" data-u="${esc(u)}">${avatar(u)} ${esc(nameOf(u))}</button>`).join('')}</div>`; }
};
/* ----- daily challenge, XP, themes (this device) ----- */
const Prog = {
  d: Object.assign({ xp: 0, done: {}, streak: 0, lastDay: '', theme: 'teal', back: 'rani' }, LS.get('dotd-prog') || {}),
  mk: null, last: 0, seenH: {},
  save() { LS.set('dotd-prog', this.d); },
  day() { const t = new Date(); return t.getFullYear() + '-' + (t.getMonth() + 1) + '-' + t.getDate(); },
  today() { return CHALLENGES[Fun.hash(this.day()) % CHALLENGES.length]; },
  level() { return Math.floor(this.d.xp / 100) + 1; },
  addXP(n, why) { const before = this.level(); this.d.xp += n; this.save(); if (this.level() > before) { const un = [...THEMES, ...BACKS].filter(x => x.lvl === this.level()).map(x => x.n);
      App.toast('Level ' + this.level() + '!' + (un.length ? ' Unlocked: ' + un.join(', ') + '.' : '')); } },
  complete(id) { const day = this.day(), c = this.today(); if (c.id !== id || this.d.done[day]) return;
    const y = new Date(Date.now() - 864e5), yd = y.getFullYear() + '-' + (y.getMonth() + 1) + '-' + y.getDate();
    this.d.done = { [day]: id }; this.d.streak = this.d.lastDay === yd ? this.d.streak + 1 : 1; this.d.lastDay = day; this.save();
    App.toast('Challenge complete: ' + c.t + '. +30 XP'); this.addXP(30); },
  onPub(p) {
    const m = p && p.match, me = App.uid; if (!m || !m.matchId || !m.names || !m.names[me]) return;
    const mk = m.matchId; if (mk !== this.mk) { this.mk = mk; this.last = Math.max(0, ...(m.events || []).map(e => e.id || 0)); this.seenH = {}; return; }
    const evs = m.events || [];
    if (Fun.showdownCls(m) && Fun.active(m).includes(me)) this.sd = m.handNo;
    evs.forEach(e => { if (!e.id || e.id <= this.last) return; this.last = e.id;
      const mineCuts = evs.filter(x => x.h === e.h && x.k === 'cut' && x.u === me).length;
      if (e.k === 'cut' && e.u === me) { if (e.total >= 5) this.complete('big5'); if (mineCuts >= 3) this.complete('threecuts'); }
      if (e.k === 'out' && e.u === me) { if (!mineCuts) this.complete('nocut'); if (!evs.some(x => x.h === e.h && x.k === 'out' && x.id < e.id)) { this.complete('first'); this.addXP(5); } }
      if (e.k === 'power' && e.u === me) this.complete('magic');
      if (e.k === 'donkey' && !this.seenH[e.h]) { this.seenH[e.h] = 1; this.addXP(e.u === me ? 5 : 10);
        if (e.u !== me && this.sd === e.h) this.complete('survive');
        const r = m.lastResult; if (r && r.bets && r.bets[me] && r.bets[me] === e.u) this.complete('bet'); }
    });
    if (m.phase === 'MATCH_RESULT' && m.award && !this.seenH['aw']) { this.seenH['aw'] = 1; this.addXP(20); if (m.losses[me] <= 1) this.complete('lowloss'); }
  },
  setTheme(t, b) { const lv = this.level(); if (t) { const x = THEMES.find(y => y.id === t); if (!x || x.lvl > lv) return; this.d.theme = t; } if (b) { const x = BACKS.find(y => y.id === b); if (!x || x.lvl > lv) return; this.d.back = b; } this.save(); this.apply(); App.renderSheet(); },
  apply() { const t = THEMES.find(x => x.id === this.d.theme) || THEMES[0], b = BACKS.find(x => x.id === this.d.back) || BACKS[0], r = document.documentElement.style;
    if (t.id === 'teal') { r.removeProperty('--felt'); r.removeProperty('--felt2'); } else { r.setProperty('--felt', t.f); r.setProperty('--felt2', t.f2); } r.setProperty('--back', b.b); },
  challengeHTML() { const c = this.today(), done = this.d.done[this.day()] === c.id; return `<div class="chal ${done ? 'done' : ''}"><span aria-hidden="true">${done ? '✅' : '🎯'}</span><div class="grow"><div class="note">Today’s challenge${this.d.streak > 1 ? ` · ${this.d.streak}-day streak` : ''}</div><b>${c.t}</b></div></div>`; },
  sheet() { const lv = this.level(), into = this.d.xp % 100;
    return `<h2>My progress</h2><p>Level <b>${lv}</b> · ${this.d.xp} XP</p><div class="xpbar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${into}"><i style="width:${into}%"></i></div><p class="note">${100 - into} XP to level ${lv + 1}. Hands, escapes, matches and challenges all earn XP on this device.</p>
    ${this.challengeHTML()}
    <h3 style="font-size:20px;margin-top:14px">Table colour</h3><div class="swatches">${THEMES.map(t => `<button class="sw ${this.d.theme === t.id ? 'on' : ''}" data-a="v7-theme" data-k="${t.id}" ${t.lvl > lv ? 'disabled' : ''} aria-pressed="${this.d.theme === t.id}"><span class="chip2" style="background:radial-gradient(${t.f},${t.f2})"></span>${t.n}<small>${t.lvl > lv ? '🔒 Level ' + t.lvl : ''}</small></button>`).join('')}</div>
    <h3 style="font-size:20px;margin-top:14px">Card back</h3><div class="swatches">${BACKS.map(t => `<button class="sw ${this.d.back === t.id ? 'on' : ''}" data-a="v7-back" data-k="${t.id}" ${t.lvl > lv ? 'disabled' : ''} aria-pressed="${this.d.back === t.id}"><span class="chip2 cb" style="background:${t.b}"></span>${t.n}<small>${t.lvl > lv ? '🔒 Level ' + t.lvl : ''}</small></button>`).join('')}</div>`; }
};
Prog.apply();

App.boot();

</script>
